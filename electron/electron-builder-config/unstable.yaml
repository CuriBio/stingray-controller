# https://www.electron.build/configuration/configuration#configuration
productName: "Stingray 96 Controller"
appId: "CuriBio.Stingray.Controller"
asar: true
directories:
  buildResources: "electron-build-resources"
  output: "dist"
extraFiles:
  - "dist-python/"
files:
  - "package.json"
  - from: "dist/main/"
    to: "dist/main/"
  - from: "dist/renderer/"
    to: "dist/renderer/"
win:
  target: "nsis"
  artifactName: "Stingray96Controller-Setup-unstable-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
publish:
  provider: "s3"
  bucket: "downloads.curibio.com"
  path: "software/stingray"
  channel: "unstable"
  region: "us-east-1"
